name: Run Scraper

on:
  schedule:
    # Schedule the job to run every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering of the workflow
  
jobs:
  scrape:
    runs-on: ubuntu-22.04
    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 4: Setup Google credentials
      - name: Setup Google credentials
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS }}" | base64 --decode > $GITHUB_WORKSPACE/credentials.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}

      # Step 5: Run the scraper script with environment variables
      - name: Run scraper
        env:
          GOOGLE_APPLICATION_CREDENTIALS: $GITHUB_WORKSPACE/credentials.json
          SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python main.py
